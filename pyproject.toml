[project]
name = "our_life"
version = "0.4.5"
requires-python = ">=3.11"
dependencies = []

# 仅开发/测试依赖，不进运行时；插件本体零第三方依赖的原则不变
[dependency-groups]
dev = ["pytest>=8.0"]

# 插件根目录自带 __init__.py（它是包本体不是测试），限定只收集 tests/。
# importlib 导入模式是硬需求：官方市场 CI 会把插件挂到宿主
# neko/plugin/plugins/our_life/ 包树内跑测试，默认 prepend 模式会把根 __init__.py
# 当包模块解析导致相对导入崩溃；importlib 按文件路径导入，两种环境都能稳定收集。
# 运行方式：在插件根目录执行 ``uv run python -m pytest tests -q``
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.neko.build]
exclude_dirs = [
    ".github",
    ".vscode",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "tests",
    # 开发期工具（五门 release_gate）：依赖仓外宿主，运行时零引用，不进发行包
    "tools",
]
exclude_files = [
    ".gitignore",
    "uv.lock",
    "ruff.toml",
    "DESIGN.md",
    "CHANGELOG.md",
]
