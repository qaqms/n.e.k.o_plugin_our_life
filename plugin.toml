[plugin]
id = "our_life"
name = "我们的生活"
description = "养成系陪伴：为猫娘维护饱食 / 精力 / 心情 / 健康 / 好感五项随真实时间演化的状态，以她自己的身心感受强注入对话上下文。她有作息（夜里会睡）、有金币与背包，每天会自己吃掉你囤的口粮——囤得够、按时回来，日子就过得下去。掉到生病 / 闹脾气 / 饿坏了档时她会主动开口。"
short_description = "养成系数值：五项状态随真实时间与作息演化，她每天自己吃饭，口粮顾问帮你算该囤多少"
keywords = [
    "养成",
    "好感度",
    "心情",
    "健康",
    "饱食",
    "精力",
    "口粮",
    "金币",
    "背包",
    "陪伴",
    "数值",
    "affection",
    "mood",
    "health",
    "satiety",
    "energy",
    "economy",
    "raising",
    "tamagotchi",
    "care",
]
version = "0.5.0"
type = "plugin"
entry = "plugin.plugins.our_life:OurLifePlugin"

[plugin.author]
name = "qaqms"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.store]
# 数值 / 时间戳 / 连续天数必须持久化。
# 注意：enabled = false 时 PluginStore 会「静默」失效——set 返回 Ok 却不落盘、get 返回默认值，
# 不会报错，所以这里必须保持 true（见 DESIGN.md 已知陷阱 §4）。
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "我们的生活"
entry = "ui/panel.tsx"
context = "dashboard"
# state:read 读数值快照；config:read 读当前配置形状；action:call 才能点按钮。
# 权限按最小必要声明：本面板不需要 config:write（写配置统一走 entry → self.config.set）。
permissions = ["state:read", "config:read", "action:call"]

[plugin_runtime]
enabled = true
# 随宿主自动启动：状态要靠后台 tick 采样行为并结算衰减，不自动启动就永远不会演化。
# 知情同意由总开关 [our_life].enabled = false（fail-closed）保证——未显式打开前
# 不注入、不结算、不推送，只空转采样。
auto_start = true

# ---------------------------------------------------------------------------
# 业务配置
# 这里的值是「默认值」；用户在 <用户数据根>/plugins/our_life/config/plugin.toml 里的覆盖层
# 优先。config.example.toml 是同一份形状的镜像（那份不含任何 [plugin*] 表）。
# 分档阈值、模型常量（饱食/精力衰减速率、耦合阈值）与纪念日锚点不在此暴露：
# 它们固定在 core/model.py 与 core/rhythm.py 里作为单一来源，避免配置漂移。
# ---------------------------------------------------------------------------

[our_life]
# fail-closed 总开关：false = 完全冻结（不注入、不结算衰减、不吃饭、不推送），数值原样保留。
enabled = false
# 后台 tick 间隔（秒）。负责行为采样 + 惰性衰减结算 + 进食 + 注入判定。
tick_seconds = 30

[our_life.decay]
# 心情：小时级。向静息基线回落（高于基线降、低于基线升），不是一路掉到 0。
mood_tau_hours = 3.0
mood_rest_baseline = 55.0
# 健康：天级。同样向静息基线回落；长期冷落会额外扣（见 neglect）。
health_tau_hours = 36.0
health_rest_baseline = 70.0
# 好感：周级。只缓慢回落、不自动回升——它只靠互动长（见 growth）。
affection_tau_days = 45.0

[our_life.rhythm]
# 作息：睡眠时段（支持跨零点，24 表示 24:00 即次日 00:00）。
# 睡眠时精力回复、饱食掉得慢、不吃东西，也不会被非危机的注入吵醒。
sleep_start_hour = 24
sleep_end_hour = 8
# 纪念日（相处第 3/7/14/30/60/100/180/365 天与每个整年）的一次性奖励。
anniversary_mood = 12.0
anniversary_affection = 5.0

[our_life.economy]
# 金币与口粮：她每天会自己吃掉背包里的口粮；囤的吃完而你没回来，她就会饿。
enabled = true
# 口粮种类（可买物品的 id 之一）：自动进食优先吃它，口粮顾问按它的单价算补货建议。
staple_item_id = "meat"
# 每天自动发的零花钱（按本地日期，一天一次）。
daily_allowance = 30
# 单个角色的携带上限（每种物品最多几件）。
carry_max = 8
# 每日消费上限（0 = 不限）；防止手滑把一整月的金币花在一件东西上。
shop_daily_limit = 240
# 饱食低于这个值她就想吃饭（落在「吃饱了」档内，见面板档位）。
meal_threshold = 55.0
# 口粮顾问：囤货视野（天）与"快见底"的告警阈值（天）。
advisor_horizon_days = 7
advisor_warn_days = 2.0
# 新角色卡初始金币。
start_sodas = 40
# 日薪：每次发言的报酬、跨天首触的奖励、连续相处每天的加成、单次结算最多认几次发言。
turn_reward = 0.6
new_day_bonus = 4.0
streak_reward = 0.7
max_turns_per_session = 20

[our_life.growth]
# 每次用户发言：心情 +2.5 / 健康 +0.8 / 好感 +0.35。
# 同一会话内第 n 次发言按 1/(1+n*session_diminish) 递减，避免"连发刷数值"。
turn_mood_gain = 2.5
turn_health_gain = 0.8
turn_affection_gain = 0.35
session_diminish = 0.15
# 跨天首次互动（连续天数续上）：一次性给得更多。
day_greet_mood = 8.0
day_greet_health = 2.0
day_greet_affection = 3.0
# 连续互动天数里程碑：到达即额外奖励，每个里程碑只给一次（里程碑值随状态持久化）。
streak_milestones = [3, 7, 14, 30]
streak_affection_bonus = [5.0, 8.0, 12.0, 20.0]
streak_mood_bonus = [10.0, 10.0, 15.0, 20.0]
streak_sodas_bonus = [5, 10, 20, 40]

[our_life.feedback]
# 反馈闭环（v0.3.0）：她自己判断"刚才那轮聊得怎么样"，回流成**有上限的修正项**。
# 为什么要它：成长只按发言条数算，连发 20 条「嗯」和认真聊 20 句拿到一样的步长。
# 四条闸门（单次幅度、会话递减、每日上限、需要真实互动作前提）固定在
# core/judgment.py，这里只露"上限类"旋钮——单次幅度是 turn_*_gain 的引用，不进配置。
enabled = true
# 当日"正向修正"预算（单位是心情分，健康/好感按比例同向缩小）。
# 默认 8.0 约合她报 3 次「特别开心」，远小于一天真实互动能给的量。
daily_add_points = 8.0
# 当日"负向修正"预算：刻意比正向小一半。让工具能扣分等于给模型一条惩罚通道，
# 所以它只能是"这轮聊得敷衍"的轻微表达，不可能把一个角色卡刷成闹脾气。
daily_subtract_points = 4.0
# 同一会话内第 n 次判断的递减强度：权重 × 1/(1 + n*damp)。
session_damp = 0.5

[our_life.events]
# 阶段性事件（v0.4.0）：把「她病过、然后好了」这种时刻从连续读数里摘出来，给它一个名字。
# 与 tier_change 的区别：后者播报「身体：生病 → 一般」（是读数），
# 这条讲「你身上那场不舒服终于过去了」（是经历），并且会进面板的「她经历过什么」。
# 两条判据线（病愈 40 / 哄好 20）直接引用档位表 TIER_BOUNDS，固定在 core/events.py，
# 不作为配置项——面板显示的档位与真的触发事件必须是同一个判据。
# 事件**只叙事、不给数值奖励**（纪念日的礼物照旧由 [our_life.rhythm] 负责）。
enabled = true
# 同一件事的冷却（小时）：心情是小时级、掉下去又上来是常态，6 小时压住反复。
mood_recovery_min_interval_hours = 6.0
# 病愈冷却：比一天略短，允许「隔天又病了、又好了」这种真的两次经历。
health_recovery_min_interval_hours = 20.0

[our_life.neglect]
# 冷落惩罚（拟真、惩罚式）：超过 grace_hours 没互动，按天扣（只扣心情/健康/好感），
# 各自有上限，避免"一个月没来直接清零"这种不可逆体验。
# 饱食与精力不在这里扣——它们由作息与进食驱动，再扣一次就是双重惩罚。
grace_hours = 24.0
mood_penalty_per_day = 6.0
health_penalty_per_day = 4.0
affection_penalty_per_day = 2.0
mood_penalty_cap = 25.0
health_penalty_cap = 20.0
affection_penalty_cap = 12.0

[our_life.inject]
# 强注入的三重频控：距上次注入至少 min_interval_sec；每小时最多 max_per_hour 次；
# 注入正文最多 max_chars 字符（防 prompt 膨胀）。
min_interval_sec = 1200
max_per_hour = 3
max_chars = 320
# 分档「向下」跨越到危机档时，升级为 ai_behavior="respond"，让她主动开口；
# 其余跨越一律 ai_behavior="read"（进上下文但不打断）。
respond_on_crisis = true
# 危机档判据（「不高于」该档即算危机）：心情 / 身体 / 肚子 / 精力。
crisis_mood_tier = "sulking"
crisis_health_tier = "sick"
crisis_satiety_tier = "starving"
crisis_energy_tier = "exhausted"
# 她主动「索取陪伴」LLM 工具的冷却（秒）。
company_cooldown_sec = 7200
# 「她主动开口」的每小时上限（比 max_per_hour 更严，避免她一天里反复弹你）。
respond_max_per_hour = 1
# 她在睡觉时是否压住非危机注入（危机照旧允许：真饿坏了那本来就该被照顾）。
quiet_during_sleep = true
