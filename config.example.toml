# 运行时配置模板 / Runtime config template
#
# 本文件只展示「用户可以覆盖的形状」，不含任何 [plugin*] 表（校验会报 error）。
# N.E.K.O 首次需要运行配置时会把本文件复制到用户数据目录：
#   <用户数据根>/plugins/our_life/config/plugin.toml
# 已存在则不覆盖；用户改过的键作为覆盖层叠加在 plugin.toml 的默认值之上。
#
# 存储根默认位置：Windows %LOCALAPPDATA%\N.E.K.O，macOS ~/Library/Application Support/N.E.K.O，
# Linux $XDG_DATA_HOME/N.E.K.O（或 ~/.local/share/N.E.K.O）。

[plugin_runtime]
enabled = true
# 随宿主自动启动：状态靠后台 tick 演化。真正是否生效由下面的 [our_life].enabled 决定。
auto_start = true

[our_life]
# fail-closed 总开关。false = 完全冻结：不注入、不结算衰减、不吃饭、不推送，数值原样保留。
# 打开后插件才开始「过日子」。
enabled = false
# 后台 tick 间隔（秒）：行为采样 + 惰性衰减结算 + 进食 + 注入判定。
tick_seconds = 30

[our_life.decay]
# 时间常数（越大掉得越慢）。心情小时级、健康天级、好感周级。
mood_tau_hours = 3.0
# 心情静息基线：高于它回落、低于它回升（不会一路归零）。
mood_rest_baseline = 55.0
health_tau_hours = 36.0
health_rest_baseline = 70.0
# 好感只缓慢回落、不自动回升——它只能靠互动长。
affection_tau_days = 45.0

[our_life.rhythm]
# 作息：睡眠时段（支持跨零点，24 表示 24:00 即次日 00:00）。
# 睡眠时她精力回复、饱食掉得慢、不吃东西，也不会被非危机的注入吵醒。
sleep_start_hour = 24
sleep_end_hour = 8
# 纪念日（相处第 3/7/14/30/60/100/180/365 天与每个整年）的一次性奖励。
anniversary_mood = 12.0
anniversary_affection = 5.0

[our_life.economy]
# 金币与口粮：她每天会自己吃掉背包里的口粮；囤的吃完而你没回来，她就会饿。
enabled = true
# 口粮种类（可买物品的 id 之一）：自动进食优先吃它，口粮顾问按它的单价算补货建议。
staple_item_id = "meat"
# 每天自动发的零花钱（按本地日期，一天一次）。
daily_allowance = 30
# 单个角色的携带上限（每种物品最多几件）。
carry_max = 8
# 每日消费上限（0 = 不限）；防止手滑把一整月的金币花在一件东西上。
shop_daily_limit = 240
# 饱食低于这个值她就想吃饭（落在「吃饱了」档内，见面板档位）。
meal_threshold = 55.0
# 口粮顾问：囤货视野（天）与"快见底"的告警阈值（天）。
advisor_horizon_days = 7
advisor_warn_days = 2.0
# 新角色卡初始金币。
start_sodas = 40
# 日薪：每次发言的报酬、跨天首触的奖励、连续相处每天的加成、单次结算最多认几次发言。
turn_reward = 0.6
new_day_bonus = 4.0
streak_reward = 0.7
max_turns_per_session = 20

[our_life.growth]
# 每次用户发言的成长步长；同一会话内递减（session_diminish 控制递减强度）。
turn_mood_gain = 2.5
turn_health_gain = 0.8
turn_affection_gain = 0.35
session_diminish = 0.15
# 跨天首次互动的一次性礼物。
day_greet_mood = 8.0
day_greet_health = 2.0
day_greet_affection = 3.0
# 连续互动天数里程碑（每个只结算一次），以及对应的好感 / 心情 / 金币奖励。
streak_milestones = [3, 7, 14, 30]
streak_affection_bonus = [5.0, 8.0, 12.0, 20.0]
streak_mood_bonus = [10.0, 10.0, 15.0, 20.0]
streak_sodas_bonus = [5, 10, 20, 40]

[our_life.feedback]
# 反馈闭环：她自己判断「刚才那轮聊得怎么样」，回流成有上限的修正项。
# 为什么要它：成长只按发言条数算，连发 20 条「嗯」和认真聊 20 句拿到一样的步长。
# 四条闸门固定在 core/judgment.py，这里只露上限类旋钮：
#   ① 单次幅度 = 一次真实互动步长的 0.6 倍（引用 turn_*_gain，不进配置）
#   ② 同一会话内第 n 次按 1/(1 + n*damp) 递减
#   ③ 每日累计上限（正向 / 负向分开）
#   ④ 必须存在真实互动证据（她不能凭空给自己加分）
enabled = true
# 当日正向修正预算（单位是心情分；健康与好感按比例同向缩小）。
daily_add_points = 8.0
# 当日负向修正预算：刻意只有正向的一半，避免工具变成惩罚通道。
daily_subtract_points = 4.0
# 会话内递减强度。
session_damp = 0.5

[our_life.neglect]
# 冷落惩罚：超过 grace_hours 没互动后按天扣（只扣心情/健康/好感），且各有上限。
# 饱食与精力不在这里扣——它们由作息与进食驱动，再扣一次就是双重惩罚。
grace_hours = 24.0
mood_penalty_per_day = 6.0
health_penalty_per_day = 4.0
affection_penalty_per_day = 2.0
mood_penalty_cap = 25.0
health_penalty_cap = 20.0
affection_penalty_cap = 12.0

[our_life.inject]
# 强注入频控：距上次注入至少 min_interval_sec，每小时最多 max_per_hour 次，
# 正文最多 max_chars 字符。调大这些值 = 更安静的陪伴。
min_interval_sec = 1200
max_per_hour = 3
max_chars = 320
# 掉到危机档时是否让她主动开口（ai_behavior="respond"）。
respond_on_crisis = true
# 危机档判据（「不高于」该档即算危机）：心情 / 身体 / 肚子 / 精力。
crisis_mood_tier = "sulking"
crisis_health_tier = "sick"
crisis_satiety_tier = "starving"
crisis_energy_tier = "exhausted"
# 她主动索取陪伴的冷却（秒）。
company_cooldown_sec = 7200
# 「她主动开口」的每小时上限（比 max_per_hour 更严，避免她一天里反复弹你）。
respond_max_per_hour = 1
# 她在睡觉时是否压住非危机注入（危机照旧允许）。
quiet_during_sleep = true
